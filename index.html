<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Portfolio">
<title>Smart English Language Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,500&display=swap">
<style>
/* Layout: one reading column (index-card file); sticky header with three tabs; cards are the only boxed objects. */
:root{
  --paper:#ECEFF3; --card:#FBFCFD; --sunk:#E2E7EE; --ink:#141B26; --muted:#5A6577; --line:#D2D8E0;
  --accent:#2B47B0; --accent-ink:#FFFFFF; --accent-soft:#DCE3FA;
  --mark:#F5DC57; --mark-ink:#141B26;
  --good:#1E7B4E; --warn:#A86300; --bad:#B3261E;
  --st-new:#6E7889; --st-rec:#2B47B0; --st-call:#6B3FA0; --st-use:#A86300; --st-master:#1E7B4E;
  --shadow:0 1px 2px rgba(20,27,38,.06),0 6px 20px rgba(20,27,38,.06);
  --display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --arabic:"Amiri","IBM Plex Sans Arabic","Geeza Pro","Arial",serif;
  --arabic-ui:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F141B; --card:#18202A; --sunk:#121820; --ink:#E6EBF2; --muted:#98A4B6; --line:#2A3441;
  --accent:#93A8FF; --accent-ink:#0C1222; --accent-soft:#25305A;
  --mark:#E3C53C; --mark-ink:#141B26;
  --good:#5CC48E; --warn:#E5A548; --bad:#F2837A;
  --st-new:#9AA4B5; --st-rec:#93A8FF; --st-call:#C3A2EE; --st-use:#E5A548; --st-master:#5CC48E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F141B; --card:#18202A; --sunk:#121820; --ink:#E6EBF2; --muted:#98A4B6; --line:#2A3441;
  --accent:#93A8FF; --accent-ink:#0C1222; --accent-soft:#25305A;
  --mark:#E3C53C; --mark-ink:#141B26;
  --good:#5CC48E; --warn:#E5A548; --bad:#F2837A;
  --st-new:#9AA4B5; --st-rec:#93A8FF; --st-call:#C3A2EE; --st-use:#E5A548; --st-master:#5CC48E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
mark{background:linear-gradient(transparent 12%,var(--mark) 12%,var(--mark) 88%,transparent 88%);color:var(--mark-ink);padding:0 .15em;border-radius:2px}
.ar{font-family:var(--arabic);direction:rtl;unicode-bidi:isolate}
.ar-ui{font-family:var(--arabic-ui);direction:rtl;unicode-bidi:isolate}

.shell{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header.top .inner{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font:600 21px/1.2 var(--display);letter-spacing:-.01em}
.brand h1 span{color:var(--muted);font-weight:500;font-style:italic}
.brand .ar-ui{font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:4px}
nav.tabs button{background:none;border:0;padding:8px 12px 10px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .count{font-size:12px;font-variant-numeric:tabular-nums;background:var(--sunk);border-radius:99px;padding:0 7px;color:var(--muted)}

main section{padding-top:22px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.pad{padding:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn.big{padding:12px 22px;font-size:16px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:99px;width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.iconbtn:hover{color:var(--accent);border-color:var(--accent)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
.in{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;font-size:15px;color:var(--ink)}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical;min-height:80px;line-height:1.5}
.in.term{font:500 19px/1.3 var(--display)}
.in.ar{font-size:19px;text-align:right}
.hint{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}
.hint svg{flex:none;margin-top:2px}

.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 13px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* Status chips + Leitner pips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.02em;padding:2px 9px;border-radius:99px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-new{color:var(--st-new);background:color-mix(in srgb,var(--st-new) 14%,transparent)}
.s-rec{color:var(--st-rec);background:color-mix(in srgb,var(--st-rec) 14%,transparent)}
.s-call{color:var(--st-call);background:color-mix(in srgb,var(--st-call) 14%,transparent)}
.s-use{color:var(--st-use);background:color-mix(in srgb,var(--st-use) 15%,transparent)}
.s-master{color:var(--st-master);background:color-mix(in srgb,var(--st-master) 15%,transparent)}
.tag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 7px;white-space:nowrap}
.tag.ex{border-style:dashed}
.pips{display:inline-flex;gap:3px;align-items:center}
.pips i{width:12px;height:5px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--accent)}
.freq{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.freq b{color:var(--ink);font-weight:600}
.freq .bars{display:inline-flex;gap:2px;align-items:flex-end;height:13px}
.freq .bars i{width:4px;border-radius:1px;background:var(--line)}
.freq .bars i.on{background:var(--accent)}
.freq.sm{font-size:12px}
.freqinfo{display:flex;flex-direction:column;gap:6px}
.entry.current{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.listenbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(20,27,38,.10);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.listenbar .inner{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.listenbar #lb-next{flex:1;justify-content:center;padding:12px 16px;font-size:16px}
.listenbar .pos{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.6em;text-align:center}
body.listening .shell{padding-bottom:110px}
body.listening .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.sugg{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;cursor:pointer}
.sugg:hover{border-color:var(--muted)}
.sugg[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 55%,var(--card))}
.sugg-top{display:flex;gap:10px;align-items:baseline}
.sugg .t{font:600 18px/1.3 var(--display);flex:1;min-width:0;overflow-wrap:anywhere}
.sugg .a{font-size:18px;line-height:1.4;text-align:right}
.sugg .m{font-size:14px;color:var(--muted)}
.sugg .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sugg .ex{font:italic 500 15px/1.5 var(--display)}
.tick{flex:none;width:18px;height:18px;border:2px solid var(--line);border-radius:5px;align-self:center;display:grid;place-items:center}
.sugg[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.sugg[aria-pressed="true"] .tick::after{content:"";width:5px;height:9px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* Today */
.hero{padding:26px 22px;display:flex;flex-direction:column;gap:14px}
.hero .bignum{font:600 44px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero h2{font:500 22px/1.3 var(--display)}
.ladder{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.ladder span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat .n{font:600 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted)}
.notice{border:1px dashed var(--line);border-radius:10px;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px;color:var(--muted)}

/* Review */
.progress{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);transition:width .3s}
.rcard{padding:26px 22px;display:flex;flex-direction:column;gap:18px;min-height:280px}
.rcard .term{font:600 34px/1.15 var(--display);letter-spacing:-.015em;overflow-wrap:anywhere}
.rcard .arbig{font-size:32px;line-height:1.5}
.ipa{font-size:14px;color:var(--muted)}
.sentence{font:italic 500 18px/1.55 var(--display);overflow-wrap:anywhere}
.sentence.plain{font-style:normal;font-family:var(--body);font-size:15.5px;font-weight:400}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--accent);color:transparent;line-height:1.1}
.divider{height:1px;background:var(--line)}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 14px;font-size:14.5px}
.kv dt{color:var(--muted);font-size:12.5px;padding-top:2px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ex-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grade{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
.grade small{font-weight:400;color:var(--muted);font-size:12px}
.grade.again{color:var(--bad)} .grade.hard{color:var(--warn)} .grade.good{color:var(--good)}
.grade.suggest{border-width:2px;border-color:currentColor;background:color-mix(in srgb,currentColor 8%,var(--card))}
.verdict{font-weight:600;display:flex;gap:8px;align-items:center}
.verdict.ok{color:var(--good)} .verdict.mid{color:var(--warn)} .verdict.no{color:var(--bad)}
.feedback{background:var(--sunk);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.spinner{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}.bar span{transition:none}}

/* Add */
.cands{display:flex;flex-wrap:wrap;gap:8px}
.cand{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;max-width:100%}
.cand b{font:600 15.5px/1.3 var(--display)}
.cand small{color:var(--muted);font-size:12.5px}
.cand[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.draft{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.draft .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.warnline{font-size:13px;color:var(--warn);font-weight:500}
.err{color:var(--bad);font-size:14px}
.filepick{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.filepick input{position:absolute;width:1px;height:1px;opacity:0}
.thumb{max-height:140px;border-radius:8px;border:1px solid var(--line)}

/* Portfolio */
.tools{display:flex;flex-direction:column;gap:10px}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox .in{padding-left:36px}
.list{display:flex;flex-direction:column;gap:10px}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 18px;cursor:pointer;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px}
.entry:hover{border-color:var(--muted)}
.entry-wrap{position:relative}
.entry.has-speak .meta{padding-right:46px}
.entry-speak{position:absolute;right:12px;bottom:12px;background:var(--card)}
.entry-speak.playing{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.entry .t{font:600 18px/1.3 var(--display);overflow-wrap:anywhere}
.entry .a{font-size:19px;line-height:1.4;text-align:right;align-self:start}
.entry .m{grid-column:1/-1;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.entry .meta{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{padding:34px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font:500 22px/1.3 var(--display)}

/* Detail sheet */
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:20;display:flex;justify-content:center;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;border-radius:14px 14px 0 0;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:720px){.overlay{align-items:center}.sheet{border-radius:14px;max-height:88%}}
.sheet .term{font:600 28px/1.2 var(--display);overflow-wrap:anywhere}
.sheet .arbig{font-size:28px;line-height:1.5}
.confirm{background:color-mix(in srgb,var(--bad) 9%,var(--card));border:1px solid color-mix(in srgb,var(--bad) 35%,var(--line));border-radius:8px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;font-size:14px}

/* Mic + settings */
.field{display:flex;gap:8px;align-items:flex-start}
.field > .in{flex:1;min-width:0}
.micbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.micbtn:hover{color:var(--accent);border-color:var(--accent)}
.micbtn.live{color:var(--accent-ink);background:var(--bad);border-color:var(--bad);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.65}}
@media (prefers-reduced-motion:reduce){.micbtn.live{animation:none}}
.setgroup{display:flex;flex-direction:column;gap:14px}
.setgroup h3{font:500 18px/1.3 var(--display)}
.keyline{display:flex;gap:8px;flex-wrap:wrap}
.keyline .in{flex:1 1 240px;min-width:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.okline{color:var(--good);font-size:14px;font-weight:500}
.banner{border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));background:var(--accent-soft);border-radius:10px;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

@media (max-width:520px){
  .rcard .term{font-size:28px}
  .hero .bignum{font-size:38px}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{padding-top:6px}
  .draft .grid2{grid-template-columns:minmax(0,1fr)}
  .stat .n{font-size:22px}
  nav.tabs button{padding:8px 9px 10px}
}
</style>
</head>
<body>

<header class="top">
  <div class="inner">
    <div class="brand">
      <h1>Smart English <span>Portfolio</span></h1>
      <span class="ar-ui" lang="ar">حافظة اللغة الإنجليزية الذكية</span>
    </div>
    <nav class="tabs" aria-label="Sections">
      <button id="tab-today" data-view="today" aria-current="page">Today</button>
      <button id="tab-add" data-view="add">Add</button>
      <button id="tab-portfolio" data-view="portfolio">Portfolio <span class="count" id="count">0</span></button>
      <button id="tab-settings" data-view="settings">Settings</button>
    </nav>
  </div>
</header>

<div class="shell">
  <main>
    <section id="view-today" aria-label="Today"></section>
    <section id="view-add" aria-label="Add an expression" hidden></section>
    <section id="view-portfolio" aria-label="Portfolio" hidden></section>
    <section id="view-settings" aria-label="Settings" hidden></section>
  </main>
</div>
<div id="sheet-root"></div>
<div id="listenbar" class="listenbar" hidden role="region" aria-label="Next and Listen">
  <div class="inner">

<script>
(() => {
"use strict";
/* ---------- constants & helpers ---------- */
const DAY = 864e5;
const STEPS = [0, 1, 3, 7, 14, 30, 60, 120, 240];   // Leitner intervals in days per step
const MASTER_STEP = 6;                              // 60-day interval = mastered
let NEW_PER_DAY = 5, MAX_REVIEWS = 20;
const SECS = { new: 40, recognize: 20, recall: 35, use: 75 };

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const marked = s => esc(s).replace(/\[\[(.+?)\]\]/g, "<mark>$1</mark>");
const unmark = s => String(s ?? "").replace(/\[\[(.+?)\]\]/g, "$1");
const norm = s => String(s ?? "").toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ").trim().replace(/^to /, "");
const sod = (t = Date.now()) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const dayKey = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

const ICON = {
  speak: '<svg class="i" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  mic: '<svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  search: '<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>',
  close: '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  spark: '<svg class="i" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>',
  cam: '<svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
};

function modeOf(e) { const s = e.step || 0; return s === 0 ? "new" : s === 1 ? "recognize" : s <= 3 ? "recall" : "use"; }
function statusOf(e) {
  const s = e.step || 0;
  if (s === 0) return ["New", "s-new"];
  if (s === 1) return ["Recognize", "s-rec"];
  if (s <= 3) return ["Recall", "s-call"];
  if (s < MASTER_STEP) return ["Use", "s-use"];
  return ["Mastered", "s-master"];
}
function pips(e) { const s = Math.min(e.step || 0, MASTER_STEP); let h = '<span class="pips" aria-label="Step ' + s + ' of ' + MASTER_STEP + '">'; for (let i = 1; i <= MASTER_STEP; i++) h += `<i class="${i <= s ? "on" : ""}"></i>`; return h + "</span>"; }
function dueLabel(e) {
  if (!e.step) return "Not started";
  const d = Math.round((sod(e.due) - sod()) / DAY);
  if (e.due <= Date.now()) return "Due now";
  if (d <= 0) return "Due later today";
  if (d === 1) return "Due tomorrow";
  if (d < 30) return `Due in ${d} days`;
  return "Due " + new Date(e.due).toLocaleDateString(undefined, { day: "numeric", month: "short" });
}

/* ---------- speech ---------- */
let voice = null, voiceLang = "en-GB";
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices(), L = voiceLang.toLowerCase();
    const is = v => v.lang.replace("_", "-").toLowerCase() === L;
    voice = vs.find(v => is(v) && /natural|google|neural|daniel|serena|samantha/i.test(v.name)) || vs.find(is) || vs.find(v => /^en/i.test(v.lang)) || null;
  } catch (_) {}
}
try { speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); } catch (_) {}
const canSpeak = (() => { try { return "speechSynthesis" in window; } catch (_) { return false; } })();
function speak(text) {
  if (!canSpeak || !text) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(unmark(text)); if (voice) u.voice = voice; u.lang = voice?.lang || voiceLang; u.rate = .92; speechSynthesis.speak(u); } catch (_) {}
}
const speakBtn = (text, label = "Listen") => canSpeak ? `<button class="iconbtn" data-speak="${esc(text)}" aria-label="${label}" title="${label}">${ICON.speak}</button>` : "";

/* ---------- state ---------- */
const S = {
  view: "today", entries: [], stats: {}, loaded: false, slow: false, dbError: null, unavailable: false, notOwner: false,
  session: null,
  add: { sugg: [], sPicked: new Set(), shown: [], theme: "", mode: "type", term: "", context: "", source: "", text: "", file: null, fileUrl: "", cands: [], picked: new Set(), drafts: [], busy: false, error: "" },
  pf: { q: "", filter: "all", sort: "new" },
  open: null, editing: false, confirmDel: false,
  aiOff: false, imagesOk: false,
};
/* ---------- on-device storage ---------- */
const KEY_DATA = "sep.portfolio.v1", KEY_SET = "sep.settings.v1";
const MODELS = [["claude-sonnet-5-5", "Claude Sonnet 5.5 (recommended)"], ["claude-haiku-5-5", "Claude Haiku 5.5 (fastest, lowest cost)"], ["claude-opus-5-5", "Claude Opus 5.5 (most capable)"]];
const DEFAULT_SETTINGS = { aiTopic: "any", aiLevel: "common", apiKey: "", model: "claude-sonnet-5-5", newPerDay: 5, maxReviews: 20, voice: "en-GB", micLang: "en-US", lastBackup: 0 };
let SET = { ...DEFAULT_SETTINGS };
let storageOk = true;
const clampInt = (v, a, b, d) => { const n = parseInt(v, 10); return Number.isFinite(n) ? Math.min(b, Math.max(a, n)) : d; };
const newId = () => (window.crypto?.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

/* Storage: IndexedDB (large, private to this app) with localStorage as a fallback. */
const DB_NAME = "smart-english-portfolio";
let idb = null, storeMode = "idb", bc = null, writeChain = Promise.resolve();
const plain = o => JSON.parse(JSON.stringify(o));
const reqP = r => new Promise((ok, bad) => { r.onsuccess = () => ok(r.result); r.onerror = () => bad(r.error); });
function idbOpen() {
  return new Promise((ok, bad) => {
    let r; try { r = indexedDB.open(DB_NAME, 1); } catch (e) { bad(e); return; }
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains("entries")) d.createObjectStore("entries", { keyPath: "id" }); if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta"); };
    r.onsuccess = () => ok(r.result); r.onerror = () => bad(r.error); r.onblocked = () => bad(new Error("blocked"));
    setTimeout(() => bad(new Error("timeout")), 6000);
  });
}
function txDone(t) { return new Promise((ok, bad) => { t.oncomplete = () => ok(); t.onerror = () => bad(t.error); t.onabort = () => bad(t.error); }); }
function storeErr(e) {
  storageOk = false;
  toast(e?.name === "QuotaExceededError" ? "Storage is full. Export a backup, then delete some entries." : "This browser isn't saving your data (private mode?). Export a backup before closing.");
}
function dbWrite(fn) {
  writeChain = writeChain.then(fn).then(() => { try { bc?.postMessage("changed"); } catch (_) {} }).catch(storeErr);
  return writeChain;
}
function lsPersist() {
  try { localStorage.setItem(KEY_DATA, JSON.stringify({ app: "smart-english-portfolio", version: 1, entries: S.entries, stats: S.stats })); return true; }
  catch (e) { storeErr(e); return false; }
}
function saveAllNow() {
  const t = idb.transaction(["entries", "meta"], "readwrite"), es = t.objectStore("entries");
  es.clear(); for (const e of S.entries) es.put(plain(e));
  t.objectStore("meta").put(plain(S.stats || {}), "stats"); t.objectStore("meta").put(true, "initialized");
  return txDone(t);
}
function persist() { if (storeMode === "ls") return lsPersist(); dbWrite(saveAllNow); return true; }
function saveEntry(e) {
  if (storeMode === "ls") return lsPersist();
  const copy = plain(e);
  dbWrite(() => { const t = idb.transaction("entries", "readwrite"); t.objectStore("entries").put(copy); return txDone(t); });
}
function removeEntry(id) {
  if (storeMode === "ls") return lsPersist();
  dbWrite(() => { const t = idb.transaction("entries", "readwrite"); t.objectStore("entries").delete(id); return txDone(t); });
}
function saveStats() {
  if (storeMode === "ls") return lsPersist();
  const copy = plain(S.stats || {});
  dbWrite(() => { const t = idb.transaction("meta", "readwrite"); t.objectStore("meta").put(copy, "stats"); return txDone(t); });
}
async function readDB() {
  const t = idb.transaction(["entries", "meta"]);
  const [entries, stats, initialized] = await Promise.all([reqP(t.objectStore("entries").getAll()), reqP(t.objectStore("meta").get("stats")), reqP(t.objectStore("meta").get("initialized"))]);
  return { entries: entries || [], stats: stats || {}, initialized: !!initialized };
}
async function loadAll() {
  try { SET = { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem(KEY_SET) || "{}") }; } catch (_) {}
  applySettings();
  try { idb = await idbOpen(); storeMode = "idb"; } catch (_) { storeMode = "ls"; }
  if (storeMode === "idb") {
    try {
      const d = await readDB();
      if (d.initialized) { S.entries = d.entries; S.stats = d.stats; }
      else {
        let raw = null; try { raw = localStorage.getItem(KEY_DATA); } catch (_) {}
        if (raw) { const old = JSON.parse(raw); S.entries = Array.isArray(old.entries) ? old.entries : []; S.stats = old.stats || {}; }
        else { S.entries = seedExamples(); S.stats = {}; }
        await saveAllNow();
        if (raw) { try { localStorage.removeItem(KEY_DATA); } catch (_) {} toast(`Moved ${plural(S.entries.length, "expression")} to the new, larger storage`); }
      }
      try { bc = new BroadcastChannel("smart-english-portfolio"); bc.onmessage = async () => { try { const d2 = await readDB(); S.entries = d2.entries; S.stats = d2.stats; onData(); } catch (_) {} }; } catch (_) {}
      try { navigator.storage?.persist?.().catch(() => {}); } catch (_) {}
      return;
    } catch (_) { storeMode = "ls"; }
  }
  // Fallback: localStorage
  try {
    const raw = localStorage.getItem(KEY_DATA);
    if (raw) { const d = JSON.parse(raw); S.entries = Array.isArray(d.entries) ? d.entries : []; S.stats = d.stats || {}; }
    else { S.entries = seedExamples(); S.stats = {}; lsPersist(); }
  } catch (_) { storageOk = false; S.entries = seedExamples(); }
}
function saveSettings() { try { localStorage.setItem(KEY_SET, JSON.stringify(SET)); } catch (_) { toast("Settings couldn't be saved in this browser."); } applySettings(); }
function applySettings() {
  NEW_PER_DAY = clampInt(SET.newPerDay, 0, 30, 5);
  MAX_REVIEWS = clampInt(SET.maxReviews, 5, 100, 20);
  S.aiOff = !SET.apiKey;
  voiceLang = SET.voice || "en-GB"; pickVoice();
}
function addEntry(doc) { const e = { id: newId(), ...doc }; S.entries.push(e); saveEntry(e); onData(); }
function updateEntry(id, patch) { const e = S.entries.find(x => x.id === id); if (!e) return; Object.assign(e, patch); saveEntry(e); onData(); }
function deleteEntry(id) { S.entries = S.entries.filter(x => x.id !== id); removeEntry(id); onData(); }
function setStats(st) { S.stats = st; saveStats(); }
window.addEventListener("storage", ev => {   // keep two open tabs in step (fallback storage only)
  if (storeMode !== "ls" || ev.key !== KEY_DATA || !ev.newValue) return;
  try { const d = JSON.parse(ev.newValue); S.entries = d.entries || []; S.stats = d.stats || {}; onData(); } catch (_) {}
});
function downloadFile(name, data, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], { type })); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

function seedExamples() {
  const t = Date.now();
  const base = { example: true, pos: "", source: "Example", step: 0, reps: 0, lapses: 0, lastReview: 0 };
  return [
    { ...base, id: "ex-move-the-needle", created: t, due: t, term: "move the needle", kind: "idiom", ipa: "/muːv ðə ˈniːdl/", meaning: "To make a noticeable, measurable difference to a situation or result.", in_context: "Make a real, visible difference to research output.", ar: "يُحدث فرقًا ملموسًا", ar_alt: "يعمل فرق حقيقي", ar_literal: "يحرّك الإبرة", frequency: 3, cefr: "C1", used_in: ["business", "news"], frequency_note: "Mainly spoken and journalistic; more common in US English.", register: "informal", note: "Common in business talk, often in the negative: \"this won't move the needle\". Avoid it in formal academic writing.", collocations: ["really move the needle", "won't move the needle", "move the needle on something"], examples: ["One more committee won't [[move the needle]] on graduate employability.", "Partnering with industry labs could really [[move the needle]] for our students."], context: "Small grants alone will not move the needle on research output.", context_marked: "Small grants alone will not [[move the needle]] on research output." },
    { ...base, id: "ex-double-edged-sword", created: t + 1, due: t + 1, term: "a double-edged sword", kind: "idiom", ipa: "/ə ˌdʌbl ˈedʒd sɔːd/", meaning: "Something that has both clear advantages and serious disadvantages.", in_context: "", ar: "سلاح ذو حدّين", ar_alt: "", ar_literal: "", frequency: 3, cefr: "C1", used_in: ["news", "academic", "everyday speech"], frequency_note: "", register: "neutral", note: "Arabic has the same image, so it transfers well. Note the article: \"is a double-edged sword\".", collocations: ["prove to be a double-edged sword", "something of a double-edged sword"], examples: ["Generative AI in the classroom is [[a double-edged sword]].", "Rapid automation can prove to be [[a double-edged sword]] for the labour market."], context: "", context_marked: "" },
    { ...base, id: "ex-low-hanging-fruit", created: t + 2, due: t + 2, term: "low-hanging fruit", kind: "idiom", ipa: "/ˌləʊ ˌhæŋɪŋ ˈfruːt/", meaning: "The easiest tasks or goals, which bring results with little effort.", in_context: "", ar: "المكاسب السهلة", ar_alt: "الحاجات اللي في المتناول", ar_literal: "الثمار المتدلّية", frequency: 3, cefr: "C1", used_in: ["business", "news"], frequency_note: "Typical of meetings and management writing.", register: "informal", note: "Uncountable: say \"the low-hanging fruit\", not \"fruits\". Popular in strategy meetings.", collocations: ["go for the low-hanging fruit", "pick the low-hanging fruit"], examples: ["Let's start with [[the low-hanging fruit]]: digitising the admission forms.", "Once the [[low-hanging fruit]] is gone, real reform gets harder."], context: "", context_marked: "" },
  ];
}

/* ---------- Claude API client (direct from the browser, user's own key) ---------- */
class AIError extends Error { constructor(code, msg) { super(msg || code); this.code = code; } }
async function askJSON(prompt, { image = null, signal, maxTokens = 3000 } = {}) {
  if (!SET.apiKey) throw new AIError("no_key");
  const content = [];
  if (image) content.push({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: await imageToBase64(image) } });
  content.push({ type: "text", text: prompt + "\n\nReply with the JSON only, no other text." });
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST", signal,
      headers: { "content-type": "application/json", "x-api-key": SET.apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: SET.model || DEFAULT_SETTINGS.model, max_tokens: maxTokens, messages: [{ role: "user", content }] }),
    });
  } catch (e) { throw new AIError(e?.name === "AbortError" ? "cancelled" : "network"); }
  if (!res.ok) {
    let detail = ""; try { detail = (await res.json())?.error?.message || ""; } catch (_) {}
    const s = res.status;
    const code = s === 401 || s === 403 ? "auth" : s === 404 ? "model" : s === 429 ? "rate_limited" : s >= 500 ? "overloaded" : /credit|billing/i.test(detail) ? "billing" : "bad_request";
    throw new AIError(code, detail);
  }
  const data = await res.json();
  if (data.stop_reason === "refusal") throw new AIError("refused");
  const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("").trim();
  if (!text) throw new AIError("empty_completion");
  return parseJSONLoose(text);
}
function parseJSONLoose(t) {
  try { return JSON.parse(t); } catch (_) {}
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) { try { return JSON.parse(fence[1]); } catch (_) {} }
  const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (_) {} }
  throw new AIError("invalid_json");
}
async function imageToBase64(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new AIError("image_rejected")); i.src = url; });
    const k = Math.min(1, 1568 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.85).split(",")[1];
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- dictation (browser speech recognition) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recTarget = null;
const micBtn = id => SR ? `<button class="micbtn" type="button" data-mic="${id}" aria-label="Dictate" title="Dictate">${ICON.mic}</button>` : "";
function toggleMic(id) {
  if (rec) { const same = recTarget === id; try { rec.stop(); } catch (_) {} rec = null; recTarget = null; setMicUI(); if (same) return; }
  const el = document.getElementById(id); if (!el || !SR) return;
  const r = new SR(); r.lang = SET.micLang || "en-US"; r.interimResults = true; r.continuous = false;
  const base = el.value ? el.value.replace(/\s*$/, " ") : "";
  r.onresult = ev => { let t = ""; for (const x of ev.results) t += x[0].transcript; el.value = base + t; el.dispatchEvent(new Event("input", { bubbles: true })); };
  r.onerror = ev => {
    if (ev.error === "not-allowed" || ev.error === "service-not-allowed") toast("Microphone access is blocked. Allow it in your browser settings.");
    else if (ev.error === "no-speech") toast("No speech heard. Tap the microphone and try again.");
    else if (ev.error === "network") toast("Dictation needs an internet connection in this browser.");
  };
  r.onend = () => { if (rec === r) { rec = null; recTarget = null; setMicUI(); } };
  rec = r; recTarget = id;
  try { r.start(); } catch (_) { rec = null; recTarget = null; }
  setMicUI();
}
function setMicUI() { document.querySelectorAll("[data-mic]").forEach(b => b.classList.toggle("live", b.dataset.mic === recTarget)); }
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 3200); }

/* ---------- AI (sample) ---------- */
function aiErr(e) {
  const c = e?.code;
  if (c === "no_key") return "Add your Anthropic API key in Settings to use AI help.";
  if (c === "cancelled") return "";
  if (c === "auth") return "Your API key was rejected. Check it in Settings.";
  if (c === "model") return "The AI model chosen in Settings isn't available to your key. Pick another model.";
  if (c === "billing") return "Your Anthropic account has no remaining credit. Add credit at console.anthropic.com.";
  if (c === "rate_limited") return "Too many AI requests right now. Wait a minute, then try again.";
  if (c === "overloaded") return "Claude is busy right now. Try again in a moment.";
  if (c === "network") return navigator.onLine === false
    ? "You're offline. Connect to the internet and try again."
    : "Couldn't reach Claude. If this page is open inside a preview or file viewer (such as the Claude app's), open it in Chrome instead, because previews block outside connections. Otherwise check for a VPN or network filter blocking api.anthropic.com.";
  if (c === "image_rejected") return "That photo couldn't be read. Try a sharper photo or a smaller image.";
  if (c === "refused") return "The AI couldn't work with this text. Try different wording.";
  if (c === "invalid_json" || c === "empty_completion") return "The AI answer came back incomplete. Try again.";
  return "Couldn't reach Claude. Try again.";
}

const FREQ = ["", "Rare", "Uncommon", "Fairly common", "Common", "Very common"];
const FREQ_SPEC = `"frequency": an integer 1-5 for how common the expression is in present-day English overall: 5 = very common (everyday; among roughly the 3,000 most used words or expressions), 4 = common (known to virtually all native speakers; met regularly in news and at work), 3 = fairly common (met now and then; typical of educated or professional usage), 2 = uncommon (seldom used; specialised, literary or old-fashioned), 1 = rare (obscure, archaic or highly technical);
"cefr": the CEFR level at which learners typically meet it: "A1", "A2", "B1", "B2", "C1" or "C2";
"used_in": up to 3 labels for where it is mostly used, from "everyday speech", "business", "academic", "news", "literature", "technical", "social media";
"frequency_note": at most 18 words on how its use differs between speech and writing, or US and UK English, if it does; otherwise "";`;
function cleanFreq(o) {
  const f = parseInt(o.frequency, 10), c = String(o.cefr || "").trim().toUpperCase();
  return {
    frequency: f >= 1 && f <= 5 ? f : 0,
    cefr: /^[ABC][12]$/.test(c) ? c : "",
    used_in: Array.isArray(o.used_in) ? o.used_in.map(x => String(x).trim()).filter(Boolean).slice(0, 3) : [],
    frequency_note: typeof o.frequency_note === "string" ? o.frequency_note.trim() : "",
  };
}
async function aiRateFrequency(entries) {
  const prompt = `You are a corpus linguist. For each English expression below, estimate how common it is, using your knowledge of large corpora of present-day English such as the British National Corpus and COCA.
Reply with only a JSON array, one object per expression, in the same order. Each object has exactly these fields:
${FREQ_SPEC}

Expressions:
${JSON.stringify(entries.map(e => e.term))}`;
  const out = await askJSON(prompt, { maxTokens: 300 + entries.length * 120 });
  const arr = Array.isArray(out) ? out : (Array.isArray(out?.items) ? out.items : []);
  return entries.map((_, i) => cleanFreq(arr[i] || {}));
}
function freqMeter(e, small) {
  const f = +e.frequency || 0; if (!f) return "";
  let bars = '<span class="bars" aria-hidden="true">';
  for (let i = 1; i <= 5; i++) bars += `<i class="${i <= f ? "on" : ""}" style="height:${3 + i * 2}px"></i>`;
  bars += "</span>";
  return `<span class="freq${small ? " sm" : ""}" title="How common: ${FREQ[f]} (${f} of 5)">${bars}<b>${FREQ[f]}</b>${e.cefr ? ` · ${esc(e.cefr)}` : ""}</span>`;
}
async function rateMissing(list, btn) {
  if (S.aiOff) { toast("Add your API key in Settings first."); return; }
  if (btn) btn.disabled = true;
  let done = 0;
  try {
    for (let i = 0; i < list.length; i += 15) {
      const chunk = list.slice(i, i + 15);
      if (btn) btn.textContent = `Rating ${Math.min(i + chunk.length, list.length)} of ${list.length}…`;
      const res = await aiRateFrequency(chunk);
      chunk.forEach((e, k) => { if (res[k].frequency) { Object.assign(e, res[k]); done++; } });
      persist(); onData();
    }
    toast(done === 1 ? "Frequency added" : `Frequency added to ${plural(done, "expression")}`);
  } catch (err) { toast(aiErr(err) || "Rating stopped."); }
  if (S.view === "portfolio") buildPortfolio();
  if (S.open) renderSheet();
}

const ENTRY_FIELDS = `"term": the expression in its dictionary (base) form, e.g. "bite the bullet", "take something for granted";
"kind": one of "word", "phrasal verb", "idiom", "collocation", "expression", "proverb";
"pos": part of speech for single words (noun, verb, adjective...), otherwise "";
"ipa": British IPA pronunciation between slashes;
"meaning": plain-English definition, at most 18 words;
"in_context": if a sentence is given, what it means in that sentence (at most 18 words), otherwise "";
"ar": the most natural Modern Standard Arabic equivalent — an idiomatic Arabic equivalent where one exists, never a clumsy word-for-word rendering;
"ar_alt": a second Arabic rendering or a common Egyptian colloquial equivalent if it helps, otherwise "";
"ar_literal": a literal word-for-word Arabic gloss only for idioms whose literal sense differs from the meaning, otherwise "";
"register": one of "formal", "neutral", "informal", "slang";
${FREQ_SPEC}
"note": one practical usage tip in English (at most 22 words): nuance, a common mistake, or a trap for Arabic speakers;
"collocations": array of up to 4 common collocations or grammar patterns;
"examples": array of 2 natural, professional-sounding example sentences with the expression wrapped in [[ ]] exactly as it appears in the sentence;
"context_marked": the given sentence with the expression wrapped in [[ ]] as it appears, or "" if no sentence was given.`;

async function aiEnrich(items) {
  const prompt = `You are an expert lexicographer helping an Egyptian Arabic-speaking university professor with advanced English master new English vocabulary.
For each item below, write a dictionary entry. Reply with only a JSON array, one object per item, in the same order. Each object has exactly these fields:
${ENTRY_FIELDS}

Items:
${JSON.stringify(items.map(i => ({ expression: i.term, sentence: i.sentence || "" })))}`;
  const out = await askJSON(prompt, { maxTokens: 1200 + items.length * 700 });
  const arr = Array.isArray(out) ? out : (Array.isArray(out?.items) ? out.items : [out]);
  return items.map((it, i) => cleanEntry(arr[i] || {}, it));
}
function cleanEntry(o, it) {
  const str = v => (typeof v === "string" ? v.trim() : "");
  const arr = v => (Array.isArray(v) ? v.map(x => String(x).trim()).filter(Boolean) : []);
  return {
    term: str(o.term) || it.term, kind: str(o.kind), pos: str(o.pos), ipa: str(o.ipa),
    meaning: str(o.meaning), in_context: str(o.in_context),
    ar: str(o.ar), ar_alt: str(o.ar_alt), ar_literal: str(o.ar_literal),
    register: str(o.register), note: str(o.note), ...cleanFreq(o),
    collocations: arr(o.collocations).slice(0, 4), examples: arr(o.examples).slice(0, 3),
    context: it.sentence || "", context_marked: str(o.context_marked) || (it.sentence || ""),
    source: it.source || "",
  };
}

const AI_TOPICS = [
  ["any", "Any topic", "any area of educated adult life"],
  ["professional", "Professional", "leadership, management, meetings, negotiation and formal emails"],
  ["academic", "Academic", "academic writing, research, presenting at conferences, peer review and lecturing"],
  ["tech", "Technology & AI", "how technology, AI and innovation are discussed in the media and at work"],
  ["everyday", "Everyday & idioms", "idioms and phrasal verbs common in everyday conversation"],
];
const AI_LEVELS = [
  ["common", "Advanced, but common (B2–C1)", "CEFR B2 to C1, rated 3, 4 or 5 on the frequency scale: expressions native speakers use often that an intermediate learner may not know yet"],
  ["advanced", "Very advanced (C1–C2)", "CEFR C1 to C2, rated 2, 3 or 4 on the frequency scale: refined, precise expressions an educated native speaker would use"],
  ["mixed", "Mixed (B1–C2)", "a mix from CEFR B1 to C2, mostly rated 3 or higher on the frequency scale"],
];
async function aiSuggest({ topic, level, theme }) {
  const T = AI_TOPICS.find(x => x[0] === topic) || AI_TOPICS[0];
  const L = AI_LEVELS.find(x => x[0] === level) || AI_LEVELS[0];
  const avoid = [...new Set([...S.entries.map(e => e.term), ...S.add.shown])];
  const prompt = `You are an expert lexicographer and English teacher. Choose 5 English words, phrasal verbs, idioms, collocations or expressions that are well worth learning for an Egyptian Arabic-speaking university professor with advanced English.
Topic: ${T[2]}.${theme ? `\nFocus especially on: ${theme.slice(0, 120)}.` : ""}
Level: ${L[2]}.
Choose expressions that are genuinely useful, natural and current. Vary the kinds (not all idioms). Do not choose any of these, which the learner already has or has seen:
${avoid.join("; ") || "(none yet)"}

Reply with only a JSON array of 5 objects. Each object has exactly these fields:
${ENTRY_FIELDS}
For "in_context" and "context_marked" use "".`;
  const out = await askJSON(prompt, { maxTokens: 5200 });
  const arr = Array.isArray(out) ? out : (Array.isArray(out?.items) ? out.items : []);
  const have = new Set(avoid.map(norm));
  return arr.map(o => cleanEntry(o || {}, { term: "", sentence: "", source: "Suggested by AI" }))
    .filter(e => e.term && !have.has(norm(e.term)) && (have.add(norm(e.term)), true));
}

async function aiExtract(text, file) {
  const intro = file ? "The attached photo shows a page of English text." : "Here is a piece of English text.";
  const prompt = `${intro} An Egyptian professional with advanced English is reading it and wants to build a personal vocabulary portfolio.
Pick up to 8 words, phrasal verbs, idioms, collocations or expressions from the text that are most worth learning: less common, idiomatic, elegant or precise usage. Skip basic vocabulary, names and technical acronyms. Use the dictionary (base) form.
Reply with only a JSON object: {"text": ${file ? "the transcribed text from the photo (at most 1200 characters)" : "\"\""}, "items": [{"term": "...", "sentence": "the full sentence from the text where it appears", "why": "at most 8 words on why it is worth learning"}]}
${file ? "" : "\nText:\n" + text.slice(0, 6000)}`;
  const out = await askJSON(prompt, { image: file || null, maxTokens: 2500 });
  const items = Array.isArray(out?.items) ? out.items : [];
  return { text: typeof out?.text === "string" ? out.text : "", items: items.filter(x => x && x.term).map(x => ({ term: String(x.term).trim(), sentence: String(x.sentence || "").trim(), why: String(x.why || "").trim() })).slice(0, 8) };
}

async function aiCheck(e, sentence, signal) {
  const prompt = `An Arabic-speaking learner with advanced English is practising the English expression "${e.term}" (meaning: ${e.meaning || e.ar}). They wrote this sentence to use it:
"""${sentence.slice(0, 600)}"""
Judge whether the expression is used correctly and naturally, with its intended meaning. Be encouraging but precise.
Reply with only a JSON object: {"verdict": "correct" | "almost" | "incorrect", "feedback": "one or two short sentences in English, at most 35 words", "corrected": "the learner's sentence with the smallest fixes needed (identical if already correct)", "model": "one natural alternative sentence using the expression, with the expression wrapped in [[ ]]"}`;
  return askJSON(prompt, { signal, maxTokens: 700 });
}

/* ---------- plan for today ---------- */
function plan() {
  const now = Date.now();
  const due = S.entries.filter(e => (e.step || 0) > 0 && e.due <= now).sort((a, b) => a.due - b.due).slice(0, MAX_REVIEWS);
  const today = dayKey();
  const doneNew = S.stats.newDay === today ? (S.stats.newCount || 0) : 0;
  const fresh = S.entries.filter(e => !e.step).sort((a, b) => (a.created || 0) - (b.created || 0)).slice(0, Math.max(0, NEW_PER_DAY - doneNew));
  const queue = [...due, ...fresh];
  const by = { new: 0, recognize: 0, recall: 0, use: 0 };
  let secs = 0;
  for (const e of queue) { const m = modeOf(e); by[m]++; secs += SECS[m]; }
  return { queue, by, mins: Math.max(1, Math.round(secs / 60)) };
}
function stageCounts() {
  const c = { "s-new": 0, "s-rec": 0, "s-call": 0, "s-use": 0, "s-master": 0 };
  for (const e of S.entries) c[statusOf(e)[1]]++;
  return c;
}
function streak() {
  const st = S.stats; if (!st.lastDay) return 0;
  const y = dayKey(Date.now() - DAY);
  return (st.lastDay === dayKey() || st.lastDay === y) ? (st.streak || 0) : 0;
}

/* ---------- Review session ---------- */
function startSession() {
  const p = plan();
  if (!p.queue.length) return;
  S.session = { queue: p.queue.map(e => e.id), i: 0, done: 0, again: 0, requeued: new Set(), phase: "front", answer: "", recallResult: null, check: null, busy: false, err: "", ctl: null, finished: false, mastered: [] };
  renderSession();
  window.scrollTo(0, 0);
}
function cur() { const s = S.session; return s && S.entries.find(e => e.id === s.queue[s.i]); }

function gradeHints(e) {
  const s = e.step || 0;
  const goodD = STEPS[Math.min(s + 1, STEPS.length - 1)];
  const hardD = Math.max(1, Math.round(STEPS[s] / 2));
  const d = n => n === 1 ? "1 day" : n < 30 ? `${n} days` : n < 60 ? "1 month" : `${Math.round(n / 30)} months`;
  return { again: "again soon", hard: d(hardD), good: d(goodD) };
}
function gradeButtons(e, suggest) {
  const h = gradeHints(e);
  const b = (g, label) => `<button class="grade ${g}${suggest === g ? " suggest" : ""}" data-grade="${g}">${label}<small>${h[g]}</small></button>`;
  return `<div class="grades">${b("again", "Again")}${b("hard", "Hard")}${b("good", "Good")}</div>`;
}
function arabicBlock(e, size = "arbig") {
  return `<div class="stack" style="gap:4px">
    <div class="ar ${size}" lang="ar">${esc(e.ar || "—")}</div>
    ${e.ar_alt ? `<div class="ar-ui muted" lang="ar" style="font-size:15px">${esc(e.ar_alt)}</div>` : ""}
    ${e.ar_literal ? `<div class="small muted">Literally: <span class="ar-ui" lang="ar">${esc(e.ar_literal)}</span></div>` : ""}</div>`;
}
function metaTags(e) {
  return [e.kind, e.pos, e.register].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join("");
}
function detailsList(e) {
  const rows = [];
  if (e.meaning) rows.push(["Meaning", esc(e.meaning)]);
  if (e.frequency) rows.push(["How common", `<div class="freqinfo">${freqMeter(e)}${e.used_in?.length ? `<span class="small muted">Mostly in: ${e.used_in.map(esc).join(", ")}</span>` : ""}${e.frequency_note ? `<span class="small muted">${esc(e.frequency_note)}</span>` : ""}</div>`]);
  else if (e.id && S.entries.some(x => x.id === e.id) && !S.aiOff) rows.push(["How common", `<button class="btn" data-rate="${esc(e.id)}">Rate how common</button>`]);
  if (e.context_marked || e.context) rows.push(["Where I met it", `<span class="sentence plain">${marked(e.context_marked || e.context)}</span>${e.in_context ? `<div class="small muted" style="margin-top:4px">Here: ${esc(e.in_context)}</div>` : ""}${e.source ? `<div class="small muted">Source: ${esc(e.source)}</div>` : ""}`]);
  else if (e.source) rows.push(["Source", esc(e.source)]);
  if (e.examples?.length) rows.push(["Examples", `<ul class="ex-list">${e.examples.map(x => `<li>${marked(x)}</li>`).join("")}</ul>`]);
  if (e.collocations?.length) rows.push(["Patterns", e.collocations.map(esc).join(" · ")]);
  if (e.note) rows.push(["Tip", esc(e.note)]);
  return `<dl class="kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
}

function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const curr = [i]; for (let j = 1; j <= n; j++) curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = curr; }
  return prev[n];
}
function judgeRecall(ans, e) {
  const a = norm(ans), t = norm(e.term).replace(/\b(something|someone|sth|sb|one's)\b/g, "").replace(/\s+/g, " ").trim();
  const full = norm(e.term);
  if (!a) return { label: "Answer shown", cls: "", suggest: null };
  const d = Math.min(lev(a, full), lev(a, t));
  if (d === 0) return { label: "Correct", cls: "ok", suggest: "good" };
  if (d <= Math.max(1, Math.floor(full.length * 0.15))) return { label: "Almost — check the spelling", cls: "mid", suggest: "hard" };
  const words = t.split(" ").filter(w => w.length > 2), hit = words.filter(w => a.includes(w)).length;
  if (words.length && hit / words.length >= .5) return { label: "Close", cls: "mid", suggest: "hard" };
  return { label: "Not quite", cls: "no", suggest: "again" };
}

async function grade(g) {
  const s = S.session, e = cur(); if (!e || s.busy) return;
  const now = Date.now(); let step = e.step || 0, due, lapses = e.lapses || 0;
  const wasNew = step === 0;
  if (wasNew) { step = 1; due = sod() + DAY; }
  else if (g === "good") { step = Math.min(step + 1, STEPS.length - 1); due = sod() + STEPS[step] * DAY; }
  else if (g === "hard") { due = sod() + Math.max(1, Math.round(STEPS[step] / 2)) * DAY; }
  else {
    step = Math.max(1, step - 1); due = now + 10 * 60 * 1000; lapses++; s.again++;
    if (!s.requeued.has(e.id)) { s.requeued.add(e.id); s.queue.push(e.id); }
  }
  if (step >= MASTER_STEP && (e.step || 0) < MASTER_STEP) { s.mastered.push(e.term); toast(`Mastered: ${e.term}`); }
  const patch = { step, due, lapses, reps: (e.reps || 0) + 1, lastReview: now };
  Object.assign(e, patch); // optimistic
  const id = e.id;
  updateEntry(id, patch);

  // stats: streak, daily new count
  const today = dayKey(), st = { ...S.stats };
  if (st.lastDay !== today) { st.streak = st.lastDay === dayKey(now - DAY) ? (st.streak || 0) + 1 : 1; st.lastDay = today; }
  st.best = Math.max(st.best || 0, st.streak || 0);
  if (wasNew) { st.newCount = st.newDay === today ? (st.newCount || 0) + 1 : 1; st.newDay = today; }
  st.totalReviews = (st.totalReviews || 0) + 1;
  S.stats = st;
  setStats(st);

  s.done++;
  nextCard();
}

}

const STOP = new Set("a an the of to in on at for by with from as and or but if than then that this these those which who whom whose what when where why how is are was were be been being am do does did don't doesn't didn't not no it its it's i me my you your we our they them their he she his her one ones thing things something someone somebody stuff very much many more most some any all just really so too can could will would should may might must shall have has had get got gets make makes need needs needed".split(" "));
function stem(w) {
  if (/[؀-ۿ]/.test(w)) {
    w = w.replace(/[ً-ْـ]/g, "").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي");
    return w.replace(/^(وال|بال|فال|كال|لل|ال)/, "").replace(/(ات|ون|ين|ها|ه)$/, "") || w;
  }
  if (w.length > 4 && w.endsWith("ies")) w = w.slice(0, -3) + "y";
  else if (w.length > 5 && w.endsWith("est")) w = w.slice(0, -3);
  else if (w.length > 5 && w.endsWith("ing")) w = w.slice(0, -3);
  else if (w.length > 4 && w.endsWith("ed")) w = w.slice(0, -2);
  else if (w.length > 4 && w.endsWith("er")) w = w.slice(0, -2);
  else if (w.length > 4 && w.endsWith("ly")) w = w.slice(0, -2);
  else if (w.length > 3 && w.endsWith("es") && /(sh|ch|x|ss)es$/.test(w)) w = w.slice(0, -2);
  else if (w.length > 3 && w.endsWith("s") && !w.endsWith("ss")) w = w.slice(0, -1);
  if (w.length > 3 && /[^aeiou]y$/.test(w)) w = w.slice(0, -1) + "i";
  if (w.length > 3 && /([^aeioul])\1$/.test(w)) w = w.slice(0, -1);
  return w;
}
function tokens(text) {
  return String(text || "").toLowerCase().replace(/[’']/g, "'").split(/[^a-z0-9'؀-ۿ]+/).filter(t => t && !STOP.has(t)).map(stem).filter(t => t.length > 1);
}
function searchIndex(e) {
  if (e._ix && e._ixv === e.term + e.meaning + e.ar) return e._ix;
  const text = [e.term, e.meaning, e.in_context, e.ar, e.ar_alt, e.ar_literal, e.note, unmark(e.context_marked || e.context), ...(e.examples || []).map(unmark), ...(e.collocations || []), ...(e.used_in || [])].join(" ");
  Object.defineProperty(e, "_ix", { value: new Set(tokens(text)), configurable: true, writable: true, enumerable: false });
  Object.defineProperty(e, "_ixv", { value: e.term + e.meaning + e.ar, configurable: true, writable: true, enumerable: false });
  return e._ix;
}
function matchScore(e, q, qt) {
  const raw = q.toLowerCase();
  if (e.term.toLowerCase().includes(raw)) return 100;
  if (`${e.ar} ${e.ar_alt} ${e.meaning}`.toLowerCase().includes(raw)) return 80;
  if (!qt.length) return 0;
  const ix = searchIndex(e); let hit = 0;
  for (const t of qt) {
    if (ix.has(t)) { hit++; continue; }
    if (t.length >= 4) for (const w of ix) { if (w.length >= 4 && (w.startsWith(t) || t.startsWith(w))) { hit += .8; break; } }
  }
  const r = hit / qt.length;
  return r >= (qt.length <= 2 ? .99 : .6) ? Math.round(r * 60) : 0;
}
async function aiSearchChunk(q, chunk) {
  const prompt = `A learner is searching their personal vocabulary list. The search may be in English or Arabic, and may describe the meaning in their own words rather than quote the expression.
Search: """${q.slice(0, 300)}"""
List (index, expression, meaning, Arabic):
${chunk.map((e, i) => `${i}. ${e.term} | ${e.meaning || ""} | ${e.ar || ""}`).join("\n")}
Reply with only a JSON array of the indexes of the expressions whose meaning matches the search, best match first, at most 8. Reply [] if none fit.`;
  const out = await askJSON(prompt, { maxTokens: 200 });
  const idx = Array.isArray(out) ? out : (Array.isArray(out?.indexes) ? out.indexes : []);
  return [...new Set(idx.map(n => parseInt(n, 10)).filter(n => n >= 0 && n < chunk.length))].map(n => chunk[n].id);
}
async function aiSearch(q) {
  const CH = 300, chunks = [];
  for (let i = 0; i < S.entries.length; i += CH) chunks.push(S.entries.slice(i, i + CH));
  const results = new Array(chunks.length); let next = 0;
  await Promise.all(Array.from({ length: Math.min(3, chunks.length) }, async () => {
    while (next < chunks.length) { const k = next++; results[k] = await aiSearchChunk(q, chunks[k]); }
  }));
  const out = [];
  for (let r = 0; r < 8; r++) for (const ids of results) if (ids?.[r]) out.push(ids[r]);
  return out.slice(0, 12);
}
