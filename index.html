function renderList() {
  const box = $("#pf-list"); if (!box) return;
  if (!S.loaded) { box.innerHTML = `<div class="thinking"><span class="spinner"></span>Loading…</div>`; return; }
  const f = S.pf, q = f.q.trim().toLowerCase(), now = Date.now();
  const qt = q ? tokens(q) : [];
  const scores = new Map();
  const ai = q && S.pf.ai?.q === q ? S.pf.ai : null;
  let list = S.entries.filter(e => {
    if (q) {
      let sc = matchScore(e, q, qt);
      if (ai) { const k = ai.ids.indexOf(e.id); if (k >= 0) sc = Math.max(sc, 50 - k); }
      if (!sc) return false;
      scores.set(e.id, sc);
    }
    const s = e.step || 0;
    if (f.filter === "due") return s > 0 && e.due <= now;
    if (f.filter === "new") return s === 0;
    if (f.filter === "learning") return s > 0 && s < MASTER_STEP;
    if (f.filter === "mastered") return s >= MASTER_STEP;
    return true;
  });
  if (q) list.sort((a, b) => scores.get(b.id) - scores.get(a.id));
  else list.sort(f.sort === "freq" ? (a, b) => ((b.frequency || 0) - (a.frequency || 0)) || a.term.localeCompare(b.term) : f.sort === "az" ? (a, b) => a.term.localeCompare(b.term) : f.sort === "due" ? (a, b) => ((a.step ? a.due : 9e15) - (b.step ? b.due : 9e15)) : (a, b) => (b.created || 0) - (a.created || 0));
  const key = `${q}|${f.filter}|${f.sort}`;
  if (S.pf.key !== key) { S.pf.key = key; S.pf.cursor = -1; }
  S.pf.order = list.map(e => e.id);
  if (S.pf.cursor >= S.pf.order.length) S.pf.cursor = S.pf.order.length - 1;
  const curId = S.pf.listening ? S.pf.order[S.pf.cursor] : null;
  if (!S.entries.length) { box.innerHTML = `<div class="card empty"><h2>Nothing here yet</h2><p class="muted">Expressions you add appear here with their Arabic equivalents.</p><button class="btn primary" data-go="add">Add an expression</button></div>`; return; }
  const aiRow = q && !S.aiOff
    ? (S.pf.aiBusy ? `<div class="thinking"><span class="spinner"></span>Searching by meaning…</div>`
      : ai ? `<p class="small muted">${ai.ids.length ? "Includes matches by meaning." : "No expression in your portfolio has that meaning."}</p>`
      : `<div class="notice"><span>${list.length ? "Not what you're looking for?" : "No words match."} Let the AI find expressions with this meaning.</span><button class="btn" id="pf-ai">${ICON.spark} Search by meaning</button></div>`)
    : "";
  if (!list.length) { box.innerHTML = (q && !S.aiOff ? "" : `<p class="muted" style="padding:12px 2px">No expressions match. Try another search or filter.</p>`) + aiRow; return; }
  box.innerHTML = list.map(e => { const [l, c] = statusOf(e); return `<div class="entry-wrap"><button class="entry${e.id === curId ? " current" : ""}${canSpeak ? " has-speak" : ""}" data-open="${e.id}">
      <span class="t">${esc(e.term)}</span><span class="a ar" lang="ar">${esc(e.ar)}</span>
      ${e.meaning ? `<span class="m">${esc(e.meaning)}</span>` : ""}
      <span class="meta"><span class="chip ${c}">${l}</span>${pips(e)}<span class="small muted">${dueLabel(e)}</span>${freqMeter(e, true)}${e.example ? '<span class="tag ex">Example</span>' : ""}</span></button>${canSpeak ? `<button class="iconbtn entry-speak" data-speak="${esc(e.term)}" aria-label="Listen to ${esc(e.term)}" title="Listen">${ICON.speak}</button>` : ""}</div>`; }).join("") + aiRow;
  updateListenBar();
}

/* ---------- Next and Listen ---------- */
function updateListenBar() {
  const bar = $("#listenbar"), on = !!S.pf.listening && S.view === "portfolio";
  bar.hidden = !on; document.body.classList.toggle("listening", on);
  if (!on) return;
  const n = (S.pf.order || []).length, c = S.pf.cursor;
  $("#lb-pos").textContent = `${c >= 0 && n ? c + 1 : 0} / ${n}`;
  $("#lb-next").disabled = !n;
  $("#lb-repeat").disabled = c < 0 || !n;
}
function listenNext() {
  const o = S.pf.order || []; if (!o.length) { toast("No expressions in this list."); return; }
  let c = S.pf.cursor + 1;
  if (c >= o.length) { c = 0; if (o.length > 1) toast("Back to the first expression"); }
  S.pf.cursor = c;
  const e = S.entries.find(x => x.id === o[c]); if (!e) return;
  speak(e.term);
  document.querySelectorAll(".entry.current").forEach(x => x.classList.remove("current"));
  const el = document.querySelector(`.entry[data-open="${CSS.escape(e.id)}"]`);
  if (el) { el.classList.add("current"); el.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth" }); }
  updateListenBar();
}
function stopListening() {
  if (!S.pf.listening) return;
  S.pf.listening = false;
  try { speechSynthesis.cancel(); } catch (_) {}
  document.querySelectorAll(".entry.current").forEach(x => x.classList.remove("current"));
  updateListenBar();
}

/* ---------- Detail sheet ---------- */
function openDetail(id) { S.open = id; S.editing = false; S.confirmDel = false; renderSheet(); }
function closeDetail() { S.open = null; $("#sheet-root").innerHTML = ""; document.body.style.overflow = ""; }
function renderSheet() {
  const root = $("#sheet-root"), e = S.entries.find(x => x.id === S.open);
  if (!e) { closeDetail(); return; }
  document.body.style.overflow = "hidden";
  const [l, c] = statusOf(e);
  const fld = (k, label, opts = "") => `<label class="f" for="e-${k}">${label}${k === "context" || k === "note" ? `<textarea class="in" id="e-${k}" rows="2" ${opts}>${esc(k === "context" ? unmark(e.context_marked || e.context) : e[k])}</textarea>` : `<input class="in${k === "term" ? " term" : ""}${k === "ar" ? " ar" : ""}" id="e-${k}" ${opts} value="${esc(e[k])}">`}</label>`;
  root.innerHTML = `<div class="overlay" id="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(e.term)}">
    <div class="row between" style="flex-wrap:nowrap;align-items:flex-start">
      <div class="row" style="gap:8px"><span class="chip ${c}">${l}</span>${pips(e)}<span class="small muted">${dueLabel(e)}</span></div>
      <button class="iconbtn" id="sheet-close" aria-label="Close">${ICON.close}</button></div>
    ${S.editing ? `<div class="stack">
        ${fld("term", "English")}${fld("ar", "Arabic equivalent", 'dir="rtl" lang="ar"')}${fld("ar_alt", "Other Arabic rendering", 'dir="rtl" lang="ar"')}
        ${fld("meaning", "Meaning")}${fld("context", "Where I met it")}${fld("source", "Source")}${fld("note", "Tip")}
        <div class="row"><button class="btn primary" id="edit-save">Save changes</button><button class="btn ghost" id="edit-cancel">Cancel</button></div></div>`
    : `<div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div class="stack" style="gap:4px;flex:1;min-width:0"><div class="term">${esc(e.term)}</div>${e.ipa ? `<div class="ipa">${esc(e.ipa)}</div>` : ""}</div>${speakBtn(e.term)}</div>
       <div class="row" style="gap:6px">${metaTags(e)}${e.example ? '<span class="tag ex">Example</span>' : ""}</div>
       ${arabicBlock(e)}
       <div class="divider"></div>${detailsList(e)}
       <p class="small muted">Added ${new Date(e.created || Date.now()).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" })} · reviewed ${plural(e.reps || 0, "time")}${e.lapses ? ` · forgot ${plural(e.lapses, "time")}` : ""}</p>
       ${S.confirmDel ? `<div class="confirm"><span>Delete “${esc(e.term)}” from your portfolio? This can't be undone.</span><span class="row"><button class="btn danger" id="del-yes">Delete</button><button class="btn ghost" id="del-no">Keep it</button></span></div>`
       : `<div class="row"><button class="btn" id="edit-start">Edit</button>${e.step ? `<button class="btn ghost" id="reset">Start over</button>` : ""}<button class="btn ghost danger" id="del">Delete</button></div>`}`}
  </div></div>`;
}

/* ---------- export ---------- */
async function exportCsv() {
  const cols = ["term", "ar", "ar_alt", "meaning", "kind", "register", "frequency", "cefr", "context", "source", "status", "next_review"];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = S.entries.map(e => [e.term, e.ar, e.ar_alt, e.meaning, e.kind, e.register, e.frequency ? `${e.frequency} - ${FREQ[e.frequency]}` : "", e.cefr, unmark(e.context_marked || e.context), e.source, statusOf(e)[0], e.step ? new Date(e.due).toISOString().slice(0, 10) : ""].map(q).join(","));
  const data = "﻿" + [cols.join(","), ...rows].join("\r\n");
  downloadFile(`english-portfolio-${dayKey()}.csv`, data, "text/csv;charset=utf-8");
}

/* ---------- events ---------- */
document.addEventListener("click", async ev => {
  const t = ev.target.closest("button, [data-go], label[for='a-file']"); if (!t) {
    if (ev.target.id === "overlay") closeDetail();
    return;
  }
  if ((t.dataset.view || t.dataset.go) && rec) { try { rec.stop(); } catch (_) {} }
  if (t.dataset.view) { if (S.session && !S.session.finished && t.dataset.view !== "today") { S.session.ctl?.abort(); S.session = null; } setView(t.dataset.view); return; }
  if (t.dataset.go) { S.session = null; setView(t.dataset.go); return; }
  if (t.dataset.speak !== undefined) { speak(t.dataset.speak); if (t.classList.contains("entry-speak")) { t.classList.add("playing"); setTimeout(() => t.classList.remove("playing"), 1200); } return; }
  if (t.dataset.mic) { toggleMic(t.dataset.mic); return; }
  const id = t.id;

  // Today / session
  if (id === "start") return startSession();
  if (id === "end-session") { S.session?.ctl?.abort(); S.session = null; buildToday(); return; }
  if (id === "rm-examples") {
    t.disabled = true;
    S.entries = S.entries.filter(x => !x.example); persist(); onData();
    toast("Examples removed"); return;
  }
  if (id === "reveal") {
    const s = S.session; s.answer = ($("#recall-in") || $("#use-in"))?.value?.trim() || s.answer;
    if (modeOf(cur()) === "recall") s.recallResult = s.answer ? judgeRecall(s.answer, cur()) : null;
    s.phase = "back"; renderSession(); return;
  }
  if (id === "recall-check") { const s = S.session; s.answer = $("#recall-in").value.trim(); s.recallResult = judgeRecall(s.answer, cur()); s.phase = "back"; renderSession(); return; }
  if (id === "use-check") return runUseCheck();
  if (id === "stop-check") { S.session.ctl?.abort(); return; }
  if (t.dataset.grade) return grade(t.dataset.grade);

  // Add
  if (t.dataset.amode) { S.add.mode = t.dataset.amode; S.add.error = ""; S.add.cands = []; S.add.picked = new Set(); buildAdd(); return; }
  if (id === "a-prepare") {
    const a = S.add; if (!a.term.trim()) { a.error = "Type the word or expression first."; buildAdd(); return; }
    return prepare([{ term: a.term.trim(), sentence: a.context.trim(), source: a.source.trim() }]);
  }
  if (id === "a-manual") { const a = S.add; a.drafts.push(manualDraft({ term: a.term.trim(), sentence: a.context.trim(), source: a.source.trim() })); a.term = ""; a.context = ""; buildAdd(); return; }
  if (id === "a-find") return findExpressions();
  if (t.dataset.aitopic) { SET.aiTopic = t.dataset.aitopic; saveSettings(); buildAdd(); return; }
  if (id === "a-suggest") {
    const a = S.add; a.busy = true; a.error = ""; a.busyMsg = "Choosing 5 expressions for you…"; buildAdd();
    try {
      const list = await aiSuggest({ topic: SET.aiTopic, level: SET.aiLevel, theme: a.theme.trim() });
      if (!list.length) a.error = "The AI didn't return new expressions. Try again or change the topic.";
      a.sugg = list; a.sPicked = new Set(); a.shown.push(...list.map(e => e.term));
    } catch (err) { a.error = aiErr(err) || ""; }
    a.busy = false; buildAdd(); return;
  }
  if (t.dataset.sugg !== undefined) { const i = +t.dataset.sugg, p = S.add.sPicked; p.has(i) ? p.delete(i) : p.add(i); buildAdd(); return; }
  if (id === "a-pick-all") { S.add.sPicked = new Set(S.add.sugg.map((_, i) => i)); buildAdd(); return; }
  if (id === "a-add-sugg") {
    const a = S.add, now = Date.now(); let n = 0;
    [...a.sPicked].sort((x, y) => x - y).forEach((i, k) => { const e = a.sugg[i]; if (!e) return; addEntry({ ...e, created: now + k, step: 0, due: now + k, reps: 0, lapses: 0, lastReview: 0 }); n++; });
    a.sugg = a.sugg.filter((_, i) => !a.sPicked.has(i)); a.sPicked = new Set();
    buildAdd(); toast(`Added ${plural(n, "expression")} to your portfolio`); return;
  }
  if (t.dataset.cand !== undefined) { const i = +t.dataset.cand, p = S.add.picked; p.has(i) ? p.delete(i) : p.add(i); buildAdd(); return; }
  if (id === "a-prep-picked") { const a = S.add; return prepare([...a.picked].sort().map(i => ({ term: a.cands[i].term, sentence: a.cands[i].sentence, source: a.source.trim() }))); }
  if (t.dataset.dsave !== undefined) { const i = +t.dataset.dsave; S.add.drafts.forEach((_, j) => readDraftInputs(j)); t.disabled = true; if (await saveDraft(i)) { S.add.drafts.splice(i, 1); } $("#drafts").innerHTML = renderDrafts(); return; }
  if (t.dataset.ddiscard !== undefined) { S.add.drafts.forEach((_, j) => readDraftInputs(j)); S.add.drafts.splice(+t.dataset.ddiscard, 1); $("#drafts").innerHTML = renderDrafts(); return; }
  if (id === "save-all") {
    t.disabled = true; S.add.drafts.forEach((_, j) => readDraftInputs(j));
    const keep = []; let n = 0;
    for (let i = 0; i < S.add.drafts.length; i++) { if (await saveDraft(i, true)) n++; else keep.push(S.add.drafts[i]); }
    S.add.drafts = keep; $("#drafts").innerHTML = renderDrafts(); toast(`Saved ${plural(n, "expression")}`); return;
  }

  // Settings
  if (id === "s-key-show") { const k = $("#s-key"); k.type = k.type === "password" ? "text" : "password"; t.textContent = k.type === "password" ? "Show" : "Hide"; return; }
  if (id === "s-save-ai") { SET.apiKey = $("#s-key").value.trim(); SET.model = $("#s-model").value; saveSettings(); buildSettings(); $("#s-ai-msg").innerHTML = SET.apiKey ? `<span class="okline">Saved. Use Test connection to check the key.</span>` : "Saved without a key. AI help stays off."; return; }
  if (id === "s-forget") { SET.apiKey = ""; saveSettings(); buildSettings(); toast("API key removed from this device"); return; }
  if (id === "s-test") {
    const msg = $("#s-ai-msg"); t.disabled = true; msg.innerHTML = `<span class="thinking"><span class="spinner"></span>Contacting Claude…</span>`;
    try { const r = await askJSON('Reply with exactly this JSON: {"ok": true}', { maxTokens: 30 }); msg.innerHTML = r?.ok ? `<span class="okline">Connected. AI help is on.</span>` : `<span class="okline">Connected.</span>`; }
    catch (e) { msg.innerHTML = `<span class="err">${esc(aiErr(e) || "Test stopped.")}</span>`; }
    t.disabled = false; return;
  }
  if (id === "s-save-practice") { SET.newPerDay = clampInt($("#s-new").value, 0, 30, 5); SET.maxReviews = clampInt($("#s-max").value, 5, 100, 20); SET.voice = $("#s-voice").value; SET.micLang = $("#s-mic").value; saveSettings(); buildSettings(); toast("Practice settings saved"); return; }
  if (id === "s-export") return exportBackup();
  if (id === "s-merge") return applyImport("merge");
  if (id === "s-replace") return applyImport("replace");
  if (id === "s-imp-cancel") { S.importPending = null; buildSettings(); return; }
  if (id === "s-wipe") { S.confirmWipe = true; buildSettings(); return; }
  if (id === "s-wipe-no") { S.confirmWipe = false; buildSettings(); return; }
  if (id === "s-wipe-yes") { S.confirmWipe = false; S.entries = []; S.stats = {}; persist(); onData(); buildSettings(); toast("Portfolio erased"); return; }

  // Portfolio
  if (t.dataset.filter) { S.pf.filter = t.dataset.filter; document.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", b.dataset.filter === S.pf.filter)); renderList(); return; }
  if (id === "pf-export") return exportCsv();
  if (id === "pf-listen") { S.pf.listening = true; return listenNext(); }
  if (id === "lb-next") return listenNext();
  if (id === "lb-repeat") { const e = S.entries.find(x => x.id === (S.pf.order || [])[S.pf.cursor]); if (e) speak(e.term); return; }
  if (id === "lb-stop") return stopListening();
  if (id === "pf-ai") {
    const q = S.pf.q.trim().toLowerCase(); if (!q) return;
    S.pf.aiBusy = true; renderList();
    try { S.pf.ai = { q, ids: await aiSearch(q) }; }
    catch (err) { toast(aiErr(err) || "Search stopped."); }
    S.pf.aiBusy = false; renderList(); return;
  }
  if (id === "rate-all") return rateMissing(S.entries.filter(e => !e.frequency), t);
  if (t.dataset.rate) { const e = S.entries.find(x => x.id === t.dataset.rate); if (e) return rateMissing([e], t); return; }
  if (t.dataset.open) return openDetail(t.dataset.open);

  // Sheet
  if (id === "sheet-close") return closeDetail();
  if (id === "edit-start") { S.editing = true; renderSheet(); return; }
  if (id === "edit-cancel") { S.editing = false; renderSheet(); return; }
  if (id === "edit-save") {
    const e = S.entries.find(x => x.id === S.open), get = k => ($("#e-" + k)?.value || "").trim();
    const ctx = get("context"); const oldCtx = unmark(e.context_marked || e.context);
    const patch = { term: get("term") || e.term, ar: get("ar"), ar_alt: get("ar_alt"), meaning: get("meaning"), source: get("source"), note: get("note") };
    if (ctx !== oldCtx) { patch.context = ctx; patch.context_marked = ctx; }
    t.disabled = true;
    S.editing = false; updateEntry(e.id, patch); toast("Changes saved");
    return;
  }
  if (id === "del") { S.confirmDel = true; renderSheet(); return; }
  if (id === "del-no") { S.confirmDel = false; renderSheet(); return; }
  if (id === "del-yes") { const eid = S.open; closeDetail(); deleteEntry(eid); toast("Deleted"); return; }
  if (id === "reset") { const eid = S.open; updateEntry(eid, { step: 0, due: Date.now(), lapses: 0 }); toast("It will come back as a new expression"); return; }
});

document.addEventListener("input", ev => {
  const t = ev.target, a = S.add;
  if (t.id === "a-term") a.term = t.value;
  else if (t.id === "a-context") a.context = t.value;
  else if (t.id === "a-source") a.source = t.value;
  else if (t.id === "a-text") a.text = t.value;
  else if (t.id === "a-theme") a.theme = t.value;
  else if (t.id === "pf-q") { S.pf.q = t.value; renderList(); }
  else if (t.id === "recall-in" || t.id === "use-in") S.session.answer = t.value;
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.id === "pf-sort") { S.pf.sort = t.value; renderList(); }
  if (t.id === "a-level") { SET.aiLevel = t.value; saveSettings(); }
  if (t.id === "s-import" && t.files?.[0]) { readBackup(t.files[0]); t.value = ""; }
  if (t.id === "a-file" && t.files?.[0]) {
    const a = S.add; if (a.fileUrl) URL.revokeObjectURL(a.fileUrl);
    a.file = t.files[0]; a.fileUrl = URL.createObjectURL(a.file); a.cands = []; a.picked = new Set(); a.error = ""; buildAdd();
  }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && S.open) { closeDetail(); return; }
  if (ev.key === "Enter" && !ev.shiftKey) {
    if (ev.target.id === "recall-in") { ev.preventDefault(); $("#recall-check")?.click(); }
    else if (ev.target.id === "a-term") { ev.preventDefault(); ($("#a-prepare") || $("#a-manual"))?.click(); }
  }
});

/* ---------- data wiring ---------- */
function onData() {

}

  </div>
  <div class="card pad setgroup">
    <h3>Backup and moving between devices</h3>
    <p class="small muted">Your portfolio is saved in this browser's own database on this device, with room for tens of thousands of expressions. To use it on your phone and your laptop, export a backup on one and import it on the other. Export regularly so nothing is lost if the browser's data is cleared.</p>
    <div class="row"><button class="btn primary" id="s-export">Export backup</button><label class="btn" for="s-import">Import backup</label><input type="file" id="s-import" accept="application/json,.json" hidden></div>
    <p class="small muted">Last backup from this device: ${last}. ${plural(S.entries.length, "expression")} stored here.</p>
    ${imp ? `<div class="confirm" style="background:var(--accent-soft);border-color:var(--line)"><span>Backup from ${esc(imp.date)} with ${plural(imp.entries.length, "expression")}. Merge keeps both and takes the most-practised copy of each expression; Replace swaps your current portfolio for the backup.</span><span class="row"><button class="btn primary" id="s-merge">Merge</button><button class="btn" id="s-replace">Replace</button><button class="btn ghost" id="s-imp-cancel">Cancel</button></span></div>` : ""}
  </div>
  <div class="card pad setgroup">
    <h3>Start over</h3>
    <p class="small muted">Erase every expression and your progress from this device. Your API key and settings stay.</p>
    ${S.confirmWipe ? `<div class="confirm"><span>Erase ${plural(S.entries.length, "expression")}? This can't be undone. Export a backup first if you might want them back.</span><span class="row"><button class="btn danger" id="s-wipe-yes">Erase everything</button><button class="btn ghost" id="s-wipe-no">Keep</button></span></div>` : `<div><button class="btn danger" id="s-wipe">Erase portfolio</button></div>`}
  </div>
  <p class="small muted" style="text-align:center">Smart English Language Portfolio · data stays on this device</p>`;
}
function exportBackup() {
  const data = JSON.stringify({ app: "smart-english-portfolio", version: 1, exported: new Date().toISOString(), entries: S.entries, stats: S.stats }, null, 1);
  downloadFile(`english-portfolio-backup-${dayKey()}.json`, data, "application/json");
  SET.lastBackup = Date.now(); saveSettings(); buildSettings();
}
async function readBackup(file) {
  try {
    const d = JSON.parse(await file.text());
    const entries = Array.isArray(d) ? d : d.entries;
    if (!Array.isArray(entries) || entries.some(e => !e || typeof e.term !== "string")) throw 0;
    S.importPending = { entries: entries.map(e => ({ ...e, id: e.id || newId(), collocations: e.collocations || [], examples: e.examples || [] })), stats: d.stats || {}, date: d.exported ? new Date(d.exported).toLocaleDateString() : "an earlier date" };
  } catch (_) { toast("That file isn't a portfolio backup."); S.importPending = null; }
  buildSettings();
}
function applyImport(mode) {
  const imp = S.importPending; if (!imp) return;
  if (mode === "replace") { S.entries = imp.entries; S.stats = imp.stats; }
  else {
    const byId = new Map(S.entries.map(e => [e.id, e])), byTerm = new Map(S.entries.map(e => [norm(e.term), e]));
    let added = 0;
    for (const e of imp.entries) {
      const mine = byId.get(e.id) || byTerm.get(norm(e.term));
      if (!mine) { S.entries.push(e); added++; }
      else if ((e.reps || 0) > (mine.reps || 0) || ((e.reps || 0) === (mine.reps || 0) && (e.lastReview || 0) > (mine.lastReview || 0))) Object.assign(mine, e, { id: mine.id });
    }
    if ((imp.stats.lastDay || "") > (S.stats.lastDay || "")) S.stats = { ...S.stats, ...imp.stats };
    toast(`Merged: ${plural(added, "new expression")} added`);
  }
  S.importPending = null; persist(); onData(); buildSettings();
  if (mode === "replace") toast("Portfolio replaced from backup");
}

async function init() {
  $("#lb-repeat").innerHTML = ICON.speak; $("#lb-stop").innerHTML = ICON.close;
  $("#lb-next").innerHTML = `Next and Listen <svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>`;
  build();
  await loadAll();
  S.loaded = true; S.imagesOk = true;
  build();
}
init();
})();
</script>
